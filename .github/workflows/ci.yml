# CI/CD del POS.
# - En cada push y pull request: pruebas (API + base en Postgres 18 + DIAN)
#   y lint + build de la web.
# - En push a main, si todo pasa: publica las imágenes en ghcr.io. El
#   servidor del local las instala solo a las 3:00 a. m. (deploy/README.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRO: ghcr.io/syxsexe

jobs:
  pruebas:
    name: Pruebas (API y base)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elg
          POSTGRES_PASSWORD: elg
          POSTGRES_DB: elg
          TZ: America/Bogota
          PGTZ: America/Bogota
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elg"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pos_api/requirements.txt
            requirements-test.txt
            db/requirements.txt
      - name: Dependencias
        run: pip install -r pos_api/requirements.txt -r requirements-test.txt -r db/requirements.txt
      - name: Pruebas
        env:
          PRUEBAS_DATABASE_URL: postgresql://elg:elg@localhost:5432/elg
          PRUEBAS_EXIGIR: "1"  # sin base o dependencias, falla en vez de saltarse las pruebas
        run: python -m pytest pos_api/pruebas db/pruebas tests -q

  web:
    name: Web (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: /api

  publicar:
    name: Publicar imágenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagen: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.imagen }}.Containerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/elgv3-${{ matrix.imagen }}:latest
            ${{ env.REGISTRO }}/elgv3-${{ matrix.imagen }}:${{ github.sha }}
          # Liga el paquete al repo (hereda su visibilidad y permisos).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}
